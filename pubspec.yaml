
name: sign_talk
description: "SignTalk - Offline-first American Sign Language companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  model_viewer_plus: ^1.10.0
  webview_flutter: ^4.14.1
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  video_player: ^2.14.1
  video_thumbnail: ^0.5.6

  # MediaPipe: hand, pose, face and holistic landmarks
  mediapipe_vision: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/avatar/female/
    - assets/animations/asl/
    - assets/avatar/runtime/
    - assets/animations/diagnostics/
    - assets/models/
    - assets/dictionary/
    - assets/mediapipe/
    - assets/translations/

hooks:
  user_defines:
    mediapipe_vision:
      tasks: [holistic_landmarker]
      models: [holistic_landmarker]

dependency_overrides:
  video_thumbnail:
    path: third_party/video_thumbnail
